  }

  .closing-content {
    position: relative;
    z-index: 2;
    max-width: 100%;
    margin: 0 auto;
  }

  .closing-title {
    font-family: 'Cormorant Garamond', 'Shippori Mincho',serif;
    font-size: clamp(1.65rem, 7vw, 2.4rem);
    font-weight: 300;
    line-height: 1.5;
    color: var(--charcoal);
    margin-bottom: 22px;
  }

  .closing-title em {
    font-style: italic;
    color: var(--gold-dark);
  }

  .closing-body {
    font-size: 0.84rem;
    line-height: 2.05;
    color: var(--warm-gray);
    letter-spacing: 0.02em;
    margin-bottom: 34px;
  }

  .closing-body br { display: none; }

  footer {
    background: var(--charcoal);
    padding: 34px 20px 90px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    align-items: center;
    border-top: 1px solid rgba(201,168,76,0.1);
  }

  .footer-logo {
    font-family: 'Cormorant Garamond', 'Shippori Mincho',serif;
    font-size: 1rem;
    color: var(--gold-light);
    letter-spacing: 0.08em;
    font-weight: 300;
    line-height: 1.5;
  }

  .footer-copy {
    font-size: 0.62rem;
    color: rgba(253,250,244,0.35);
    letter-spacing: 0.10em;
  }

  .mobile-fixed-cta {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    Z-index: 200;
    display: block;
    text-align: center;
    padding: 14px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: var(--white);
    text-decoration: none;
    font-size: 0.84rem;
    letter-spacing: 0.12em;
    box-shadow: 0 12px 30px rgba(44,40,32,0.22);
  }

  .reveal {
    opacity: 1;
    transform: none;
  }

  .image-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 28px;
  }

  .image-card {
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.16);
    background: rgba(255,255,255,0.02);
  }

  .image-card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
  }

  .image-caption {
    font-size: 0.64rem;
    letter-spacing: 0.06em;
    color: var(--warm-gray);
    padding: 12px 14px;
    line-height: 1.7;
  }

  #clinic-scene {
    background: var(--ivory);
  }

  .scene-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    margin-top: 36px;
    align-items: start;
  }

  .photo-frame {
    border: 1px solid rgba(201,168,76,0.25);
    padding: 6px;
    background: rgba(255,255,255,0.5);
  }

  .photo-frame img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
  }

  .scene-copy-box {
    background: var(--charcoal);
    padding: 28px 22px;
    border: 1px solid rgba(201,168,76,0.2);
  }

  .scene-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.58rem;
    letter-spacing: 0.22em;
    color: var(--gold);
    margin-bottom: 14px;
  }

  .scene-title {
    font-size: 1.02rem;
    color: var(--ivory);
    line-height: 1.9;
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }

  .scene-copy-box .section-body {
    color: rgba(253,250,244,0.76);
  }

  #care-scene {
    background: var(--ivory-deep);
  }

  .care-gallery {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 36px;
  }

  .staff-section {
    background: var(--ivory);
  }

  .staff-section + .staff-section {
    padding-top: 0;
  }

  .staff-lead {
    max-width: 720px;
  }

  .staff-grid {
    --staff-card-width: 320px;
    --staff-photo-height: 427px;
    display: grid;
    grid-template-columns: minmax(0, var(--staff-card-width));
    justify-content: center;
    gap: 24px;
    margin-top: 34px;
    align-items: stretch;
  }

  .staff-card {
    width: 100%;
    max-width: var(--staff-card-width);
    border: 1px solid rgba(201,168,76,0.18);
    background: rgba(255,255,255,0.72);
    padding: 18px;
    box-shadow: 0 18px 50px rgba(44,40,32,0.06);
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100%;
  }
