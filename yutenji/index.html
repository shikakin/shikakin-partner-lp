<!--
シカキンLP 量産用マスターテンプレート Ver2（複数スタッフ・写真枠固定版）
使い方：このファイル下部の SHIKAKIN_LP_CONFIG だけ編集します。
医院HP URLをもらったら、以下の項目に反映してください。

主な差し替え項目：
- sourceWebsiteUrl 医院HP
- clinicName 院名
- doctors 歯科医師一覧（複数名対応：役割・肩書き・氏名・写真）
- therapists シカキンセラピスト一覧（複数名対応：氏名・写真）
- staff photos 医師・セラピスト共通で写真枠320×427固定、3:4表示、object-fit:cover、カード高さ統一
- directorName / directorRole / therapistName は旧形式互換用
- reservationUrl WEB予約URL
- lineUrl LINE相談URL
- address 郵便番号・住所
- tel 電話番号
- access アクセス
- images 院長写真・セラピスト写真・症状画像など
- concerns / dentalSymptoms / beautySymptoms 症状リスト

固定推奨：配色・フォント・シカキン説明・推薦メッセージ・FAQ・セクション順
-->
