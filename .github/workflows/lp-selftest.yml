name: LP Generator Self Test

on:
  push:
    paths:
      - '.github/workflows/lp-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate synthetic clinic LP
        env:
          CLINIC_PAYLOAD: >-
            {"slug":"system-test-validation","clinicName":"シカキン検証歯科","website":"https://example.com/clinic","address":"東京都千代田区丸の内1-1-1","tel":"03-1234-5678","access":"東京駅徒歩1分","reservationUrl":"https://example.com/reserve","lineUrl":"https://line.me/R/ti/p/@example","clinicIntro":"自動生成検証用医院です。","doctors":[{"name":"検証 太郎","role":"院長","photo":"director-test.jpg"}],"therapists":[{"name":"検証 花子","role":"歯科衛生士","photo":"therapist-test.jpg"}]}
        run: python3 automation/generate_lp.py

      - name: Validate generated HTML
        run: |
          FILE="system-test-validation/index.html"
          test -s "$FILE"
          grep -Fq 'シカキン検証歯科' "$FILE"
          grep -Fq 'https://example.com/clinic' "$FILE"
          grep -Fq '東京都千代田区丸の内1-1-1' "$FILE"
          grep -Fq '03-1234-5678' "$FILE"
          grep -Fq '東京駅徒歩1分' "$FILE"
          grep -Fq 'https://example.com/reserve' "$FILE"
          grep -Fq 'https://line.me/R/ti/p/@example' "$FILE"
          grep -Fq '検証 太郎' "$FILE"
          grep -Fq '検証 花子' "$FILE"
          grep -Fq 'director-test.jpg' "$FILE"
          grep -Fq 'therapist-test.jpg' "$FILE"
          grep -Fq 'ctaMainUrl: "https://example.com/reserve"' "$FILE"
          ! grep -Fq '福岡歯科 統合医療研究所DC（歯科室）' "$FILE"
          ! grep -Fq '福岡歯科 TDC' "$FILE"
          ! grep -Fq '03-3662-0222' "$FILE"
          ! grep -Fq '0336620222' "$FILE"
          ! grep -Fq 'https://418.co.jp/tdc/' "$FILE"
          ! grep -Fq '東京都中央区日本橋茅場町1-10-5 エフワンビル4F' "$FILE"
          ! grep -Fq '藤 兼次' "$FILE"
          ! grep -Fq '山本 江里香' "$FILE"
          echo 'LP self-test passed'
