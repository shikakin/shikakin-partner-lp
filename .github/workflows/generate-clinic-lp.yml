name: Generate Partner Clinic LP

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Clinic JSON payload'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: partner-lp-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate LP from MASTER
        env:
          CLINIC_PAYLOAD: ${{ inputs.payload }}
        run: python3 automation/generate_lp.py

      - name: Commit generated clinic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Generate partner clinic LP"
          git push
