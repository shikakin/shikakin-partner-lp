name: Repair Yutenji LP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-yutenji.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: shikakin/utoh-shikakin
          path: source

      - name: Replace Yutenji LP with known-good source
        run: |
          rm -rf current/yutenji
          cp -R source/fukuoka-yutenji current/yutenji

      - name: Commit repaired LP
        working-directory: current
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yutenji
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Repair Yutenji LP from source repository"
          git push
